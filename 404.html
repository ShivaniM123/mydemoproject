<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          if (btnContainer) {
            btnContainer.append(backBtn);
          }
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { decorateMain } from '/scripts/scripts.js';
    import { loadSections } from '/scripts/aem.js';

    const getAuthor404Paths = () => {
      const segments = window.location.pathname.split('/').filter(Boolean);
      const locale = segments[0] && /^[a-z]{2}-[a-z]{2}$/i.test(segments[0]) ? segments[0] : null;
      return [
        ...(locale ? [`/${locale}/404`] : []),
        '/404',
      ];
    };

    const loadAuthored404 = async () => {
      const main = document.querySelector('main.error');
      if (!main) return;

      const fallback = main.querySelector('.section');
      const paths = getAuthor404Paths();

      for (const path of paths) {
        try {
          const response = await fetch(`${path}.plain.html`);
          if (!response.ok) continue;

          const html = (await response.text()).trim();
          if (!html) continue;

          main.innerHTML = html;
          decorateMain(main);
          await loadSections(main);

          if (fallback && fallback.isConnected) {
            fallback.remove();
          }
          return;
        } catch (e) {
          // do nothing and continue to next candidate path
        }
      }
    };

    window.addEventListener('load', () => {
      loadAuthored404();
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
    }

    main.error .error-number {
      width: 100%;
    }

    main.error .error-number text {
      font-family: monospace;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <svg viewBox="1 0 38 18" class="error-number">
        <text x="0" y="17">404</text>
      </svg>
      <h2 class="error-message">Page Not Found</h2>
      <p class="button-container">
        <a href="/" class="button secondary error-button-home">Go home</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
